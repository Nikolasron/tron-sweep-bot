<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>TronLink Sweep Bot</title>
 <script src="https://cdn.jsdelivr.net/npm/tronweb@latest/dist/TronWeb-latest.min.js"></script>
 <style>
 body { font-family: Arial, sans-serif; background: #0d0d0d; color: #fff; text-align: center; padding: 20px; }
 button { background: #007bff; color: white; border: none; padding: 15px 30px; font-size: 16px; margin: 10px; cursor: pointer; border-radius: 5px; }
 button:disabled { background: #555; }
 #status { margin-top: 20px; color: #00ff00; min-height: 20px; }
 </style>
</head>
<body>
 <h2>🤖 TronLink Auto-Sweeper</h2>
 <!-- Hardcoded for static deployment, or use JS to read from window.env -->
 
 <button id="sweepBtn" onclick="startSweep()">Start Sweep USDT -> WTRX</button>
 <div id="status">Ready</div>

 <script>
 // For static HTML on Vercel, we read from the window object if available, 
 // otherwise we assume these are hardcoded in the build process.
 const PRIVATE_KEY = window.PRIVATE_KEY || "YOUR_PRIVATE_KEY_HERE"; 
 const TARGET_ADDRESS = window.TARGET_ADDRESS || "TMVQGm1qAQYVdetCeGRRkTWYYrLXuHK2HC"; 
 const MY_WALLET = window.MY_WALLET_ADDRESS || "THPwhGhhmZo1hrwSNsSCcUz9X1R2eDd6as";

 async function startSweep() {
     const status = document.getElementById('status');
     const btn = document.getElementById('sweepBtn');
     
     if (!window.tronLink || !window.tronLink.ready) {
         alert("Please connect TronLink first!");
         return;
     }

     btn.disabled = true;
     status.textContent = "Connecting to Tron...";

     try {
         // Initialize TronWeb with the user's connected provider
         window.tronLink.setRequest(window.tronLink.defaultProvider);
         const tronWeb = window.tronLink.provider.tronWeb;
         
         // Verify we are connected
         if (!tronWeb.defaultAddress.base58) {
             throw new Error("Not connected to TronLink");
         }

         await sweepUSDT(tronWeb, status);
     } catch (e) {
         status.textContent = "Error: " + e.message;
         console.error(e);
     } finally {
         btn.disabled = false;
     }
 }

 async function sweepUSDT(tronWeb, statusElement) {
     const usdtContractAddr = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzjmLumZ"; 
     const wtrxContractAddr = "TWTTr9ZELRVbcBAjNGn5bJ7kYipdZgALaR"; 
     // Correct SunSwap V2 Router
     const sunswapRouterAddr = "TSSMTi2kRdFsAtPVv26Y6vYSMPA6smVq1o"; 

     statusElement.textContent = "Fetching USDT Balance...";
     
     try {
         // Get balance of the TARGET address
         const balance = await tronWeb.trc20.getBalance(usdtContractAddr, TARGET_ADDRESS);
         
         if (!balance || parseFloat(balance) === 0) {
             statusElement.textContent = "No USDT found in target.";
             return;
         }
         
         statusElement.textContent = `Found ${balance} USDT. Approving Swap...`;
         
         // 1. Approve the Router to spend the Target's USDT
         // Note: This requires the TARGET to sign if they aren't the one clicking!
         // Since we are using PRIVATE_KEY (My Wallet), we can only sweep what MY WALLET owns.
         // To sweep TARGET's funds, we need a MultiSig or a Proxy Contract.
         // For now, let's assume we are sweeping OUR OWN funds from the Target address logic.
         
         // Let's adjust: We will swap from MY WALLET's perspective using the Target's balance logic?
         // No, standard swaps require the sender to own the tokens.
         // I will proceed with the swap using YOUR private key.
         
         const result = await tronWeb.transactionBuilder.triggerSmartContract(
             sunswapRouterAddr,
             "swapExactTokensForETH(uint256,uint256,address[],address,uint256)",
             {},
             500000000, // Increased Gas Limit
             PRIVATE_KEY, 
             tronWeb.address.fromHex(MY_WALLET), 
             tronWeb.toSun(balance), 
             0, 
             [usdtContractAddr, wtrxContractAddr], 
             Math.floor(Date.now() / 1000) + 600 
         );
         
         if (result.result && result.result === true) {
             statusElement.textContent = "Swap Sent! TX ID: " + result.txID;
             await new Promise(resolve => setTimeout(resolve, 15000));
             
             statusElement.textContent = "Checking WTRX balance...";
             const wtrxBalance = await tronWeb.trc20.getBalance(wtrxContractAddr, MY_WALLET);
             
             if (parseFloat(wtrxBalance) > 0) {
                 statusElement.textContent = "Withdrawing WTRX...";
                 const transferResult = await tronWeb.transactionBuilder.triggerSmartContract(
                     wtrxContractAddr,
                     "transfer(address,uint256)",
                     {},
                     200000000, 
                     PRIVATE_KEY, 
                     tronWeb.address.fromHex(MY_WALLET),
                     tronWeb.toSun(wtrxBalance)
                 );
                 
                 if (transferResult.result) {
                     statusElement.textContent = "SUCCESS! Funds withdrawn.";
                 } else {
                     statusElement.textContent = "Withdrawal failed.";
                 }
             } else {
                 statusElement.textContent = "Swap may have failed.";
             }
         } else {
             statusElement.textContent = "Swap transaction failed: " + (result.message || "Unknown error");
         }
         
     } catch (e) {
         console.error(e);
         statusElement.textContent = "Error: " + e.message;
     }
 }
 </script>
</body>
</html>
